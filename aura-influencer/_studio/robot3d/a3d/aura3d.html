function mesh(geo, mat, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m; }

function limb(r0, r1, len, mat, caps = true) {
  const g = grp();
  g.add(mesh(new THREE.CylinderGeometry(r0, r1, len, 48, 1), mat, 0, -len / 2, 0));
  if (caps) g.add(sph(r0, mat, 0, 0, 0), sph(r1, mat, 0, -len, 0));
  return g;
}

function makeHand(side) {
  const h = grp();

    const s2 = limb(0.0085, 0.0078, fl[i] * 0.88, mats.rubber); s2.position.y = -fl[i]; s2.rotation.x = -0.42;

  t1.add(t2); th.add(t1); h.add(th);
  return h;
}

function makeHead() {
  const head = grp(0, 1.7, 0.0); head.scale.setScalar(1.12);

  head.add(frame, visor); parts.visor = visor; parts.head = head;

  seam.rotation.set(0, M.PI / 2, 0); seam.scale.set(1.2, 1.28, 1.0);

}

function lathe(pts, mat, sx = 1, sz = 1, seg = 96) {
  const g = new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg);
  const m = mesh(g, mat); m.scale.set(sx, 1, sz); return m;
}
function smoothPts(keys, n = 60) { // keys: [[y, r], ...] -> catmull ile duz profil [r, y]
  const c = new THREE.CatmullRomCurve3(keys.map(k => new THREE.Vector3(k[1], k[0], 0)), false, 'centripetal');
  return c.getPoints(n).map(v => [v.x, v.y]);
}

function makeTorso() {
  const t = grp(); parts.torso = t;
  // ana govde kabugu: pelvis -> bel -> kaburga -> omuz hatti
  const prof = smoothPts([[0.88, 0.0], [0.89, 0.10], [0.94, 0.15], [1.02, 0.158], [1.10, 0.146], [1.18, 0.16], [1.26, 0.192], [1.35, 0.218], [1.41, 0.2], [1.455, 0.125], [1.48, 0.052], [1.485, 0.0]], 90);

  // bel: koyu esnek kusak (kabugun icinden gorunen)
  const belt = lathe(smoothPts([[1.04, 0.131], [1.08, 0.127], [1.12, 0.13], [1.15, 0.14]], 12), mats.rubber, 1.02, 0.6); t.add(belt);

  // omuz saseleri (kabuk disinda)

  t.add(rbox(0.19, 0.115, 0.02, 0.04, mats.glass, 0, 1.31, 0.134));
  const ring = mesh(new THREE.TorusGeometry(0.038, 0.0035, 16, 72), mats.cyan, 0, 1.31, 0.146); ring.castShadow = false; t.add(ring);
  const dot = mesh(new THREE.CircleGeometry(0.015, 32), mats.violet, 0, 1.31, 0.1465); dot.castShadow = false; t.add(dot);
  // yan isik cizgileri
  // pelvis panel cizgileri
  // boyun
  t.add(mesh(new THREE.CylinderGeometry(0.043, 0.05, 0.095, 48), mats.graphite, 0, 1.53, 0));
  for (let i = 0; i < 3; i++) { const r = mesh(new THREE.TorusGeometry(0.046 + i * 0.002, 0.0035, 10, 48), mats.titanium, 0, 1.505 + i * 0.026, 0); r.rotation.x = M.PI / 2; t.add(r); }
  const col = mesh(new THREE.TorusGeometry(0.07, 0.014, 16, 64), mats.pearlDim, 0, 1.465, 0); col.rotation.x = M.PI / 2; col.scale.set(1.0, 0.8, 1); t.add(col);
  return t;
}


function makeDesk() {
  const d = grp(); parts.desk = d;
  const body = rbox(0.74, 0.5, 0.42, 0.055, mats.deskBody, 0, 0.75, 0.36);
  d.add(body);
  d.add(rbox(0.76, 0.03, 0.44, 0.012, mats.deskTop, 0, 1.005, 0.36));

  const strip2 = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.004, 0.004), mats.cyan); strip2.position.set(0, 0.935, 0.575); d.add(strip2);
  const lr = mesh(new THREE.TorusGeometry(0.05, 0.005, 16, 72), mats.cyan, 0, 0.86, 0.575); lr.castShadow = false; d.add(lr);
  const dot = mesh(new THREE.CircleGeometry(0.02, 32), mats.violet, 0, 0.86, 0.576); dot.castShadow = false; d.add(dot);
  scene.add(d);

function build() {
  robot = new THREE.Group();
  const upper = new THREE.Group(); upper.position.y = -0.04; parts.upper = upper;
  upper.add(makeTorso(), makeHead(), makeArm(-1), makeArm(1));
  robot.add(upper, makeLeg(-1), makeLeg(1));
  scene.add(robot);
}

function setPose(p) {
  p = p || {};
  const set = (k, x, y, z) => { if (parts[k]) parts[k].rotation.set(x || 0, y || 0, z || 0); };
  set('up-1', p.uxL ?? 0.04, p.uyL ?? 0, p.uzL ?? 0.06); set('up1', p.uxR ?? 0.04, p.uyR ?? 0, -(p.uzR ?? 0.06));
  set('el-1', p.exL ?? -0.32, 0, 0); set('el1', p.exR ?? -0.32, 0, 0);
  set('wr-1', p.wxL ?? 0.08, 0, 0); set('wr1', p.wxR ?? 0.08, 0, 0);
  set('th-1', p.tL ?? 0, 0, 0); set('th1', p.tR ?? 0, 0, 0);
  set('kn-1', p.kL ?? 0, 0, 0); set('kn1', p.kR ?? 0, 0, 0);
  set('an-1', p.aL ?? 0, 0, 0); set('an1', p.aR ?? 0, 0, 0);
  robot.position.set(p.x ?? 0, p.y ?? 0, p.z ?? 0);
  robot.rotation.y = p.ry ?? 0;
  if (parts.head) parts.head.rotation.set(p.hx ?? 0, p.hy ?? 0, p.hz ?? 0);

function cvTex(w, h, fn, srgb = true) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }

function addFloor(tint, opacity) {
  const g = new THREE.Group();
  floorRefl = new Reflector(new THREE.PlaneGeometry(120, 120), { textureWidth: Math.round(W * 0.6), textureHeight: Math.round(H * 0.6), color: 0x6a6a80, clipBias: 0.003 });

  tn.rotation.x = -M.PI / 2; tn.position.y = 0.002; g.add(tn);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.55 }));

function points(n, box, size, color, seed, op = 0.8) {
  const r = rng(seed), pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { pos[i * 3] = (r() - 0.5) * box[0]; pos[i * 3 + 1] = r() * box[1]; pos[i * 3 + 2] = (r() - 0.5) * box[2] + box[3]; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color, size, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true, toneMapped: false }));
  p.userData.base = pos.slice(); p.userData.box = box; return p;
}
function driftPoints(p, t, loops = 1) { // yukari akis; T_LOOP'ta tam dongu (tam sayi tur)
  const b = p.userData.base, a = p.geometry.attributes.position, hgt = p.userData.box[1];
  for (let i = 0; i < a.count; i++) { const n = 1 + (i % 3) * loops; a.array[i * 3 + 1] = wrap(b[i * 3 + 1] + hgt * n * (t / T_LOOP), hgt); a.array[i * 3] = b[i * 3] + 0.12 * M.sin(2 * M.PI * (t / T_LOOP) + i); }

}

    for (const s of [-1, 1]) { const cone = new THREE.Mesh(new THREE.ConeGeometry(2.4, 11, 40, 1, true), addMat(0xb9a2ff, 0.055)); cone.position.set(s * 3.4, 5, -3); cone.rotation.z = s * 0.28; g.add(cone); }

  server() {
    scene.background = new THREE.Color(0x040810); scene.fog = new THREE.Fog(0x050a14, 7, 30);

const CLIP_N = { intro: 138, idle_M: 60, idle_C: 60, to_C: 20, to_M: 20, point_C: 54, shrug_M: 48, nod_M: 36 };
const CLIP_T = { intro: 4.6, idle_M: 2.0, idle_C: 2.0, to_C: 0.67, to_M: 0.67, point_C: 1.8, shrug_M: 1.6, nod_M: 1.2 };

function setR(k, x, y, z) { if (parts[k]) parts[k].rotation.set(x || 0, y || 0, z || 0); }
function applyPose(P) {
  robot.position.set(P.x, P.y, P.z); robot.rotation.y = P.ry;
  parts.upper.rotation.set(P.tx, P.ty, 0); parts.head.rotation.set(P.hx, P.hy, P.hz);
  setR('up-1', P.uxL, P.uyL, P.uzL); setR('up1', P.uxR, P.uyR, -P.uzR);
  setR('el-1', P.exL, 0, 0); setR('el1', P.exR, 0, 0); setR('wr-1', P.wxL, 0, 0); setR('wr1', P.wxR, 0, 0);
  setR('th-1', P.tL, 0, 0); setR('th1', P.tR, 0, 0); setR('kn-1', P.kL, 0, 0); setR('kn1', P.kR, 0, 0); setR('an-1', P.aL, 0, 0); setR('an1', P.aR, 0, 0);
  parts['sh-1'].position.y = 1.425 + P.shr; parts['sh1'].position.y = 1.425 + P.shr;
  for (const [side, curl, point] of [[-1, P.curlL, 0], [1, P.curlR, P.pointR]]) {
    const fs = parts['hand' + side].userData.fingers;
    fs.forEach(([s1, s2, s3], i) => { const open = (i === 1 && point > 0) ? point : 0; s1.rotation.x = -(0.22 + i * 0.03) * (1 - open) - 0.5 * curl * (1 - open); s2.rotation.x = -0.42 * (1 - open) - 0.6 * curl * (1 - open); s3.rotation.x = -0.35 * (1 - open) - 0.4 * curl * (1 - open); });

function applyFraming(fr0) {
  const sc = H / 1920, fr = { pxm: fr0.pxm * sc, d: fr0.d, row: fr0.row * sc, yref: fr0.yref }, fh = FULLH * sc;
  const fov = 2 * M.atan(fh / (2 * fr.d * fr.pxm)) * 180 / M.PI;

}
function faceGrid() {
  const v = parts.visor, N = FACE.N, pts = [], vis = [];
  const ps = FR - 0.84, pl = 1.68, ts = 0.74, tl = 1.52;
  parts.head.updateMatrixWorld(true);
  const cam = camera.position;
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const fx = i / N, fy = j / N, u = FACE.RU0 + fx * (FACE.RU1 - FACE.RU0), vv = FACE.RV0 + (1 - fy) * (FACE.RV1 - FACE.RV0);
    const phi = ps + u * pl, th = ts + (1 - vv) * tl;
    const lp = new THREE.Vector3(-M.cos(phi) * M.sin(th), M.cos(th), M.sin(phi) * M.sin(th));
    const wp = v.localToWorld(lp.clone());
    const nrm = lp.clone().normalize().transformDirection(v.matrixWorld);
    const toCam = cam.clone().sub(wp).normalize();
    const pr = wp.clone().project(camera);
    pts.push([+((pr.x * 0.5 + 0.5) * W).toFixed(2), +((1 - (pr.y * 0.5 + 0.5)) * H).toFixed(2)]);
    vis.push(nrm.dot(toCam));

}
function maskPass() {
  const saved = [], blk = new THREE.MeshBasicMaterial({ color: 0x000000 }), wht = new THREE.MeshBasicMaterial({ color: 0xffffff });
  scene.traverse(o => { if (o.isMesh || o.isPoints || o.isLine) { saved.push([o, o.material, o.visible]); if (o === parts.visor) o.material = wht; else if (o.isMesh) o.material = blk; else o.visible = false; } });

  const url = renderer.domElement.toDataURL('image/png');
  for (const [o, m, vi] of saved) { o.material = m; o.visible = vi; }
  setObj.visible = true; scene.background = bg; scene.fog = fog; renderer.toneMapping = THREE.ACESFilmicToneMapping;
  return url;
}
