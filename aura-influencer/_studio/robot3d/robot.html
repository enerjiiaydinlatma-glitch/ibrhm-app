<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const M = (Math);
let renderer, scene, camera, robot, parts = {}, mats = {}, W = 1100, H = 1300;


function makeMats() {
  mats.pearl = new THREE.MeshPhysicalMaterial({ color: 0xd9d5e8, roughness: 0.30, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.08, envMapIntensity: 1.05, iridescence: 0.35, iridescenceIOR: 1.35, iridescenceThicknessRange: [120, 420], sheen: 0.4, sheenColor: new THREE.Color(0xc9b8ff) });
  mats.pearlDim = new THREE.MeshPhysicalMaterial({ color: 0xbdb8d3, roughness: 0.36, metalness: 0.0, clearcoat: 0.9, clearcoatRoughness: 0.12, iridescence: 0.25, iridescenceIOR: 1.3 });
  mats.graphite = new THREE.MeshStandardMaterial({ color: 0x1b1925, roughness: 0.34, metalness: 0.92, envMapIntensity: 1.2 });
  mats.titanium = new THREE.MeshStandardMaterial({ color: 0x6d6a80, roughness: 0.28, metalness: 1.0, envMapIntensity: 1.4 });
  mats.rubber = new THREE.MeshStandardMaterial({ color: 0x0f0e16, roughness: 0.7, metalness: 0.15 });
  mats.glass = new THREE.MeshPhysicalMaterial({ color: 0x030207, roughness: 0.03, metalness: 0.3, clearcoat: 1.0, clearcoatRoughness: 0.02, envMapIntensity: 1.8 });
  mats.deskBody = new THREE.MeshPhysicalMaterial({ color: 0x0b0914, roughness: 0.18, metalness: 0.7, clearcoat: 1.0, clearcoatRoughness: 0.08, envMapIntensity: 1.4 });
  mats.deskTop = new THREE.MeshPhysicalMaterial({ color: 0x14111f, roughness: 0.12, metalness: 0.6, clearcoat: 1.0, clearcoatRoughness: 0.05, envMapIntensity: 1.8 });
  mats.cyan = new THREE.MeshBasicMaterial({ color: 0x6eeeff, toneMapped: false });
  mats.violet = new THREE.MeshBasicMaterial({ color: 0xb07cff, toneMapped: false });
}

function mesh(geo, mat, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m; }
function grp(x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); return g; }
function sph(r, mat, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) { const m = mesh(new THREE.SphereGeometry(r, 56, 40), mat, x, y, z); m.scale.set(sx, sy, sz); return m; }
function rbox(w, h, d, r, mat, x = 0, y = 0, z = 0) { return mesh(new RoundedBoxGeometry(w, h, d, 7, r), mat, x, y, z); }
function glow(w, h, d, x, y, z, mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || mats.cyan); m.position.set(x, y, z); return m; }

// uzuv: ust ucta r0, alt ucta r1, uzunluk len, ASAGI dogru uzanir (y=0 ustte, y=-len altta)
function limb(r0, r1, len, mat, caps = true) {
  const g = grp();
  g.add(mesh(new THREE.CylinderGeometry(r0, r1, len, 48, 1), mat, 0, -len / 2, 0));
  if (caps) g.add(sph(r0, mat, 0, 0, 0), sph(r1, mat, 0, -len, 0));
  return g;
}

function makeHand(side) {
  const h = grp();
  h.add(rbox(0.088, 0.098, 0.032, 0.015, mats.graphite, 0, -0.055, 0));
  h.add(rbox(0.082, 0.078, 0.012, 0.011, mats.pearl, 0, -0.05, 0.02));
  const fx = [-0.031, -0.0105, 0.0105, 0.031], fl = [0.040, 0.047, 0.044, 0.037];
  fx.forEach((x, i) => {
    const f = grp(x, -0.104, 0);
    const s1 = limb(0.0092, 0.0085, fl[i], mats.rubber); s1.rotation.x = -0.22 - i * 0.03;
    const s2 = limb(0.0085, 0.0078, fl[i] * 0.88, mats.rubber); s2.position.y = -fl[i]; s2.rotation.x = -0.42;
    const s3 = limb(0.0078, 0.0068, fl[i] * 0.7, mats.rubber); s3.position.y = -fl[i] * 0.88; s3.rotation.x = -0.35;
    s2.add(s3); s1.add(s2); f.add(s1); h.add(f);
  });
  const th = grp(side * -0.05, -0.062, 0.004); th.rotation.z = side * 0.75; th.rotation.x = 0.1;
  const t1 = limb(0.0105, 0.0095, 0.04, mats.rubber); t1.rotation.x = -0.1;
  const t2 = limb(0.0095, 0.0085, 0.034, mats.rubber); t2.position.y = -0.04; t2.rotation.x = -0.28;
  t1.add(t2); th.add(t1); h.add(th);
  return h;
}

function makeArm(side) {
  const sh = grp(side * 0.222, 1.425, 0);
  sh.add(sph(0.066, mats.graphite));
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.07, 56, 40, 0, M.PI * 2, 0, 1.6), mats.pearl); cap.scale.set(0.95, 0.9, 1.05); cap.position.set(side * 0.006, 0.004, 0); cap.castShadow = true; sh.add(cap);
  const up = grp(); sh.add(up);
  up.add(limb(0.056, 0.047, 0.275, mats.pearl));
  up.add(rbox(0.012, 0.18, 0.052, 0.005, mats.graphite, side * 0.0, -0.13, 0.043));
  const el = grp(0, -0.275, 0); up.add(el);
  el.add(sph(0.05, mats.graphite));
  el.add(mesh(new THREE.TorusGeometry(0.05, 0.0035, 10, 48), mats.cyan, 0, 0, 0).rotateY(M.PI / 2));
  const fo = grp(); el.add(fo);
  fo.add(limb(0.048, 0.035, 0.255, mats.pearl));
  const wr = grp(0, -0.255, 0); fo.add(wr);
  wr.add(mesh(new THREE.CylinderGeometry(0.036, 0.036, 0.034, 40), mats.graphite, 0, -0.006, 0));
  wr.add(mesh(new THREE.TorusGeometry(0.0365, 0.0025, 10, 48), mats.cyan, 0, 0.012, 0).rotateX(M.PI / 2));
  const hand = makeHand(side); hand.position.y = -0.024; wr.add(hand);
  parts['sh' + side] = sh; parts['up' + side] = up; parts['el' + side] = el; parts['fo' + side] = fo; parts['wr' + side] = wr;
  return sh;
}

function makeLeg(side) {
  const hip = grp(side * 0.095, 0.885, 0);
  hip.add(sph(0.072, mats.graphite));
  const th = grp(); hip.add(th);
  th.add(limb(0.088, 0.06, 0.40, mats.pearl));
  const kn = grp(0, -0.40, 0); th.add(kn);
  kn.add(sph(0.062, mats.graphite));
  kn.add(mesh(new THREE.TorusGeometry(0.0615, 0.0035, 10, 48), mats.cyan, 0, 0, 0).rotateY(M.PI / 2));
  kn.add(rbox(0.075, 0.075, 0.05, 0.024, mats.pearl, 0, 0, 0.05));
  const sh = grp(); kn.add(sh);
  sh.add(limb(0.06, 0.04, 0.39, mats.pearl));
  sh.add(sph(0.05, mats.pearl, 0, -0.1, -0.02, 1, 1.5, 1));
  const an = grp(0, -0.39, 0); sh.add(an);
  an.add(sph(0.046, mats.graphite));
  const ft = grp(); an.add(ft);
  ft.add(rbox(0.1, 0.056, 0.245, 0.026, mats.pearl, 0, -0.055, 0.048));
  ft.add(rbox(0.104, 0.024, 0.25, 0.011, mats.rubber, 0, -0.092, 0.048));
  ft.add(rbox(0.09, 0.018, 0.07, 0.008, mats.graphite, 0, -0.035, 0.14));
  parts['hip' + side] = hip; parts['th' + side] = th; parts['kn' + side] = kn; parts['an' + side] = an;
  return hip;
}

function makeHead() {
  const head = grp(0, 1.7, 0.0); head.scale.setScalar(1.12);
  const sx = 0.108, sy = 0.134, sz = 0.122;
  head.add(sph(1, mats.pearl, 0, 0.0, 0, sx, sy, sz));
  head.add(sph(1, mats.pearl, 0, -0.072, 0.008, 0.09, 0.078, 0.1));
  const FR = M.PI / 2;
  const frame = new THREE.Mesh(new THREE.SphereGeometry(1, 72, 56, FR - 0.97, 1.94, 0.60, 1.82), mats.graphite);
  frame.scale.set(sx * 1.014, sy * 1.014, sz * 1.014); frame.castShadow = true;
  const visor = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 96, FR - 0.84, 1.68, 0.74, 1.52), mats.glass);
  visor.scale.set(sx * 1.026, sy * 1.026, sz * 1.026);
  head.add(frame, visor); parts.visor = visor; parts.head = head;
  for (const s of [-1, 1]) {
    const ear = mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.022, 40), mats.graphite, s * 0.108, -0.01, -0.004);
    ear.rotation.z = M.PI / 2;
    const ring = mesh(new THREE.TorusGeometry(0.0225, 0.0028, 12, 48), mats.cyan, s * 0.1205, -0.01, -0.004);
    ring.rotation.y = M.PI / 2;
    head.add(ear, ring);
  }
  const seam = mesh(new THREE.TorusGeometry(0.1, 0.0013, 8, 120, M.PI), mats.graphite, 0, 0.04, 0);
  seam.rotation.set(0, M.PI / 2, 0); seam.scale.set(1.2, 1.28, 1.0);
  head.add(seam);
  // tepe anteni (kucuk)
  head.add(mesh(new THREE.CylinderGeometry(0.0035, 0.0035, 0.03, 16), mats.graphite, 0, 0.145, -0.02));
  head.add(sph(0.007, mats.violet, 0, 0.162, -0.02));
  return head;
}

function lathe(pts, mat, sx = 1, sz = 1, seg = 96) {
  const g = new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg);
  const m = mesh(g, mat); m.scale.set(sx, 1, sz); return m;
}
function smoothPts(keys, n = 60) { // keys: [[y, r], ...] -> catmull ile duz profil [r, y]
  const c = new THREE.CatmullRomCurve3(keys.map(k => new THREE.Vector3(k[1], k[0], 0)), false, 'centripetal');
  return c.getPoints(n).map(v => [v.x, v.y]);
}

function makeTorso() {
  const t = grp(); parts.torso = t;
  // ana govde kabugu: pelvis -> bel -> kaburga -> omuz hatti
  const prof = smoothPts([[0.88, 0.0], [0.89, 0.10], [0.94, 0.15], [1.02, 0.158], [1.10, 0.146], [1.18, 0.16], [1.26, 0.192], [1.35, 0.218], [1.41, 0.2], [1.455, 0.125], [1.48, 0.052], [1.485, 0.0]], 90);
  t.add(lathe(prof, mats.pearl, 1.0, 0.62));
  // bel: koyu esnek kusak (kabugun icinden gorunen)
  const belt = lathe(smoothPts([[1.04, 0.131], [1.08, 0.127], [1.12, 0.13], [1.15, 0.14]], 12), mats.rubber, 1.02, 0.6); t.add(belt);
  for (let i = 0; i < 5; i++) { const r = mesh(new THREE.TorusGeometry(0.128, 0.0042, 10, 80), mats.titanium, 0, 1.07 + i * 0.022, 0); r.rotation.x = M.PI / 2; r.scale.set(1.0, 0.6, 1); t.add(r); }
  // omuz saseleri (kabuk disinda)
  // gogus cam paneli + amblem
  t.add(rbox(0.19, 0.115, 0.02, 0.04, mats.glass, 0, 1.31, 0.134));
  const ring = mesh(new THREE.TorusGeometry(0.038, 0.0035, 16, 72), mats.cyan, 0, 1.31, 0.146); ring.castShadow = false; t.add(ring);
  const dot = mesh(new THREE.CircleGeometry(0.015, 32), mats.violet, 0, 1.31, 0.1465); dot.castShadow = false; t.add(dot);
  // yan isik cizgileri
  // pelvis panel cizgileri
  // boyun
  t.add(mesh(new THREE.CylinderGeometry(0.043, 0.05, 0.095, 48), mats.graphite, 0, 1.53, 0));
  for (let i = 0; i < 3; i++) { const r = mesh(new THREE.TorusGeometry(0.046 + i * 0.002, 0.0035, 10, 48), mats.titanium, 0, 1.505 + i * 0.026, 0); r.rotation.x = M.PI / 2; t.add(r); }
  const col = mesh(new THREE.TorusGeometry(0.07, 0.014, 16, 64), mats.pearlDim, 0, 1.465, 0); col.rotation.x = M.PI / 2; col.scale.set(1.0, 0.8, 1); t.add(col);
  return t;
}


function makeDesk() {
  const d = grp(); parts.desk = d;
  const body = rbox(0.74, 0.5, 0.42, 0.055, mats.deskBody, 0, 0.75, 0.36);
  d.add(body);
  d.add(rbox(0.76, 0.03, 0.44, 0.012, mats.deskTop, 0, 1.005, 0.36));
  const strip = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.008, 0.008), mats.violet); strip.position.set(0, 0.975, 0.575); d.add(strip);
  const strip2 = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.004, 0.004), mats.cyan); strip2.position.set(0, 0.935, 0.575); d.add(strip2);
  const lr = mesh(new THREE.TorusGeometry(0.05, 0.005, 16, 72), mats.cyan, 0, 0.86, 0.575); lr.castShadow = false; d.add(lr);
  const dot = mesh(new THREE.CircleGeometry(0.02, 32), mats.violet, 0, 0.86, 0.576); dot.castShadow = false; d.add(dot);
  scene.add(d);
}

function build() {
  robot = new THREE.Group();
  const upper = new THREE.Group(); upper.position.y = -0.04; parts.upper = upper;
  upper.add(makeTorso(), makeHead(), makeArm(-1), makeArm(1));
  robot.add(upper, makeLeg(-1), makeLeg(1));
  scene.add(robot);
}

function setPose(p) {
  p = p || {};
  const set = (k, x, y, z) => { if (parts[k]) parts[k].rotation.set(x || 0, y || 0, z || 0); };
  set('up-1', p.uxL ?? 0.04, p.uyL ?? 0, p.uzL ?? 0.06); set('up1', p.uxR ?? 0.04, p.uyR ?? 0, -(p.uzR ?? 0.06));
  set('el-1', p.exL ?? -0.32, 0, 0); set('el1', p.exR ?? -0.32, 0, 0);
  set('wr-1', p.wxL ?? 0.08, 0, 0); set('wr1', p.wxR ?? 0.08, 0, 0);
  set('th-1', p.tL ?? 0, 0, 0); set('th1', p.tR ?? 0, 0, 0);
  set('kn-1', p.kL ?? 0, 0, 0); set('kn1', p.kR ?? 0, 0, 0);
  set('an-1', p.aL ?? 0, 0, 0); set('an1', p.aR ?? 0, 0, 0);
  robot.position.set(p.x ?? 0, p.y ?? 0, p.z ?? 0);
  robot.rotation.y = p.ry ?? 0;
  if (parts.head) parts.head.rotation.set(p.hx ?? 0, p.hy ?? 0, p.hz ?? 0);
}

function init(w, h) {
  W = w; H = h;
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);
  document.body.appendChild(renderer.domElement);
  scene = new THREE.Scene();
  const pm = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(30, 20, 30), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.012, 0.01, 0.03), side: THREE.BackSide }));
  room.position.y = 8; envScene.add(room);
  function panel(w, h, x, y, z, col, ry) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide })); m.position.set(x, y, z); m.rotation.y = ry || 0; envScene.add(m); return m; }
  panel(7, 5, -7, 6, 6, new THREE.Color(7, 6.6, 6.2), 0.9);        // buyuk soft kutu (sol-on)
  panel(1.4, 11, 9, 5, -2, new THREE.Color(3.2, 1.6, 9), -1.2);     // sag arka mor serit
  panel(1.4, 11, -9, 5, -3, new THREE.Color(1.2, 5, 7.5), 1.2);     // sol arka camgobegi serit
  panel(9, 2, 0, 14, 2, new THREE.Color(4, 4, 4.6), 0);             // ust panel
  panel(5, 1.6, 6, 3, 7, new THREE.Color(2.4, 2.2, 3.4), -0.6);     // sag-on dolgu
  scene.environment = pm.fromScene(envScene, 0.015).texture;
  scene.environmentIntensity = 1.0;
  camera = new THREE.PerspectiveCamera(25, W / H, 0.1, 50);
  makeMats(); build(); makeDesk();
  // isiklar: sicak anahtar + mor/camgobegi kenar isiklari
  const key = new THREE.DirectionalLight(0xfff2e6, 3.4); key.position.set(-1.6, 3.2, 3.0); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -1.5; key.shadow.camera.right = 1.5; key.shadow.camera.top = 2.2; key.shadow.camera.bottom = -0.5; key.shadow.camera.far = 10; key.shadow.bias = -0.0004; key.shadow.radius = 5;
  const rimL = new THREE.DirectionalLight(0xb07cff, 4.2); rimL.position.set(-3, 2.2, -2.4);
  const rimR = new THREE.DirectionalLight(0x6eeeff, 3.6); rimR.position.set(3, 1.6, -2.0);
  const fill = new THREE.DirectionalLight(0xcdd6ff, 0.35); fill.position.set(2.5, 1.2, 3);
  scene.add(key, rimL, rimR, fill);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({ opacity: 0.42 }));
  floor.rotation.x = -M.PI / 2; floor.receiveShadow = true; scene.add(floor); parts.floor = floor;
}

window.initR = (w, h) => { init(w, h); return 'ok'; };
window.shot = (cfg) => {
  setPose(cfg.pose);
  const c = cfg.cam;
  camera.fov = c.fov; camera.aspect = W / H; camera.updateProjectionMatrix();
  camera.position.set(c.px, c.py, c.pz); camera.lookAt(c.tx, c.ty, c.tz);
  parts.floor.visible = cfg.floor !== false;
  parts.desk.visible = !!cfg.desk;
  // mod: 'beauty' | 'uv' | 'mask'
  const mode = cfg.mode || 'beauty';
  const saved = [];
  if (mode !== 'beauty') {
    scene.traverse(o => { if (o.isMesh) { saved.push([o, o.material]); } });
    scene.background = null;
    const keep = parts.visor;
    for (const [o] of saved) {
      if (o === keep) {
        o.material = new THREE.ShaderMaterial({ vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}', fragmentShader: 'varying vec2 vUv; void main(){ gl_FragColor = vec4(vUv.x, vUv.y, 1.0, 1.0);}' });
      } else {
        o.material = new THREE.MeshBasicMaterial({ color: 0x000000 });
      }
    }
    renderer.toneMapping = THREE.NoToneMapping; renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    parts.floor.visible = false;
  }
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL('image/png');
  if (mode !== 'beauty') {
    for (const [o, m] of saved) o.material = m;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
  }
  return url;
};
window.ready = true;
</script></body></html>
